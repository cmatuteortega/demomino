name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (LuaJIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: tests/run.sh

  smoke:
    name: Smoke test (real game under Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE and Xvfb
        run: sudo apt-get update && sudo apt-get install -y love xvfb
      # Enters every node type and fuzzes input on each screen; fails on any
      # Lua error or crash. See tests/golden/run.sh.
      - name: Scenario run (every screen)
        run: GOLDEN_MODE=scenario tests/golden/run.sh "$RUNNER_TEMP/scenario.txt" 1
      - name: Fuzz run (title -> map -> combat)
        run: tests/golden/run.sh "$RUNNER_TEMP/fuzz.txt" 1 600
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-traces
          path: ${{ runner.temp }}/*.txt
